<html>
<head>
  <title>Clover stream</title>
    <link rel="stylesheet">
 </head>
<meta charset="utf-8" />
 <body>

    <iframe src="http://localhost:8080/stream_viewer?topic=/tubes_map"  width="570" height="500"></iframe>
    <iframe src="http://localhost:8080/stream_viewer?topic=/result"  width="330" height="130"></iframe>
    <div id="cords" style="color:black; font-size:20px;"></div>
<meta charset="utf-8" />
 <script src="js/roslib.js"></script>
   <script type="text/javascript">

   var ros = new ROSLIB.Ros({ url: 'ws://' + location.hostname + ':9090' });
   ros.on('connection', function() {console.log('Connected to websocket server.');});
   ros.on('error', function(error) {console.log('Error connecting to websocket server: ', error);});
   ros.on('close', function() {console.log('Connection to websocket server closed.');});
    
   var sub = new ROSLIB.Topic
   ({
      ros: ros,
      name: 'tubes',
      messageType: 'geometry_msgs/PoseArray'
   });


   let text = "";
   sub.subscribe(function(msg){
      msg.poses.forEach((pose, i) => {
      text += `${i}: (${pose.position.x.toFixed(2)}, ${pose.position.y.toFixed(2)})\n`;})});
   document.getElementById("cords").innerText = text;


    </script>
    </body>
</html>
